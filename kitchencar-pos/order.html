<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>ボナペティ｜ご注文</title>
<style>
  .hero {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 22px 16px 18px; text-align: center;
  }
  .hero .h-logo { font-size: 32px; }
  .hero .h-name { font-size: 23px; font-weight: 800; letter-spacing: .02em; margin-top: 2px; }
  .hero .h-msg { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .sticky-foot {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 11px 16px calc(11px + env(safe-area-inset-bottom));
  }
  .sticky-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 11px; }
  .sticky-in .s-total { flex: none; }
  .sticky-in .s-total .l { font-size: 10.5px; color: var(--muted); font-weight: 700; }
  .sticky-in .s-total .v { font-size: 21px; font-weight: 800; color: var(--accent); line-height: 1.15; }
  .sticky-in .btn { flex: 1; }
  /* ── お呼び出し番号の待機画面 ── */
  .wait {
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 40px 22px calc(30px + env(safe-area-inset-bottom));
    transition: background .4s;
  }
  .wait.is-ready { background: var(--green-soft); }

  .wait-chip {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 800; letter-spacing: .04em;
    padding: 7px 16px; border-radius: 30px;
    background: var(--card, #fff); border: 1px solid var(--line);
    color: var(--muted); margin-bottom: 26px;
  }
  .wait-chip.cooking { background: var(--accent-soft); border-color: #f3cbad; color: var(--accent-ink); }
  .wait-chip.ready   { background: var(--green); border-color: var(--green); color: #fff; }
  .wait-chip.stop    { background: #f3f1ee; border-color: var(--line-strong); color: var(--muted); }
  .wait-chip .sp {
    width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite; opacity: .7;
  }

  .wait-cap { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .1em; }
  .wait-no {
    font-size: clamp(84px, 30vw, 128px); font-weight: 800; line-height: 1;
    letter-spacing: -.04em; color: var(--accent); margin: 2px 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .wait.is-ready .wait-no { color: var(--green); }
  .wait-no.pulse { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0 } 60% { transform: scale(1.08) } 100% { transform: scale(1) } }

  .wait-head { font-size: 23px; font-weight: 800; line-height: 1.4; text-wrap: balance; margin-bottom: 8px; }
  .wait-sub  { font-size: 15px; color: var(--muted); line-height: 1.7; max-width: 22em; }
  .wait-items {
    font-size: 15px; color: #55504a; line-height: 1.9;
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 18px; margin: 24px 0 0; min-width: 62%;
  }
  .wait-foot { margin-top: 34px; width: 100%; max-width: 300px; }
  .btn-quiet {
    background: transparent; border: none; color: var(--muted);
    font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 4px;
    padding: 12px; width: 100%;
  }
  .wait-hint { font-size: 13px; color: var(--muted); margin-top: 18px; line-height: 1.7; }
  @media (prefers-reduced-motion: reduce) {
    .wait-no.pulse { animation: none; }
    .wait-chip .sp { animation-duration: 2s; }
  }
  .closed { text-align: center; padding: 70px 24px; }
  .closed .c-icon { font-size: 44px; margin-bottom: 14px; }
  .closed .c-title { font-size: 19px; font-weight: 800; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="boot" id="boot">
  <div class="spin"></div>
  <div class="boot-text">メニューを読み込み中…</div>
</div>

<!-- 受付停止中 -->
<div id="closedView" hidden>
  <div class="closed">
    <div class="c-icon">🙇</div>
    <div class="c-title">ただいま QR注文を<br>受け付けておりません</div>
    <p class="note">お手数ですが、スタッフに直接ご注文ください。</p>
  </div>
</div>

<!-- 注文フォーム -->
<div id="orderView" hidden>
  <div class="hero">
    <div class="h-logo">🍽</div>
    <div class="h-name">ボナペティ</div>
    <div class="h-msg">ご注文をお選びください</div>
  </div>

  <div class="netbar" id="netbar"><span class="netdot"></span><span id="netText">オンライン</span></div>

  <div class="container" style="padding-top:16px; padding-bottom:120px">
    <div class="sec-title">メニュー</div>
    <div class="menu-grid" id="menuGrid"></div>

    <div class="spacer-lg"></div>
    <div class="sec-title">ご注文内容</div>
    <div id="cartList"></div>

    <div class="spacer-lg"></div>
    <div class="field">
      <label>ご要望（任意）</label>
      <input class="input" id="fNote" maxlength="60" placeholder="例：ケチャップ抜きでお願いします">
    </div>

    <p class="note">※ 送信後、スタッフが内容を確認して確定します。<br>※ お会計はスタッフへお願いいたします。</p>
  </div>

  <div class="sticky-foot">
    <div class="sticky-in">
      <div class="s-total">
        <div class="l">合計</div>
        <div class="v" id="cartTotal">¥0</div>
      </div>
      <button class="btn btn-primary" id="btnSend" disabled>注文を送る</button>
    </div>
  </div>
</div>

<!-- 送信後：お呼び出し番号の待機画面 -->
<div id="waitView" hidden>
  <div class="wait" id="waitBox">
    <div class="wait-chip" id="waitChip"><span class="sp"></span><span id="waitChipText">確認中</span></div>

    <div id="waitNoWrap" hidden>
      <div class="wait-cap">お呼び出し番号</div>
      <div class="wait-no" id="waitNo">–</div>
    </div>

    <div class="wait-head" id="waitHead">ご注文を送信しました</div>
    <div class="wait-sub" id="waitSub">スタッフが確認しております。<br>そのままお待ちください。</div>

    <div class="wait-items" id="waitItems"></div>

    <div class="wait-hint" id="waitHint" hidden></div>

    <div class="wait-foot">
      <button class="btn-quiet" id="btnAgain">別の注文をする</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { firebaseConfig, yen, todayKey, hhmm, esc } from "./app-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const $ = (id) => document.getElementById(id);

let menu = [];
let cart = {};
let ready = false;

/* ── 自分の注文の控え（お呼び出し番号を受け取るため） ── */
const TICKET_KEY = 'bp_my_ticket';
let watching = null;      // 現在監視中のチケットID
let unwatch = null;       // 監視の解除関数
let lastStatus = null;
let wakeLock = null;

function newCid() {
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function saveTicket(t) { try { localStorage.setItem(TICKET_KEY, JSON.stringify(t)); } catch {} }
function loadTicket() {
  try {
    const t = JSON.parse(localStorage.getItem(TICKET_KEY) || 'null');
    // 日付が変わっていたら破棄する
    return t && t.date === todayKey() ? t : null;
  } catch { return null; }
}
function clearTicket() { try { localStorage.removeItem(TICKET_KEY); } catch {} }

/* ── 匿名ログイン（お客様は読み取りと注文送信のみ許可） ── */
let started = false;

onAuthStateChanged(auth, (user) => {
  if (!user || started) return;
  started = true;
  onValue(ref(db, '.info/connected'), (s) => {
    const on = s.val() === true;
    $('netbar').classList.toggle('offline', !on);
    $('netText').textContent = on ? 'オンライン' : '通信が不安定です';
  });

  onValue(ref(db, 'settings/qrEnabled'), (s) => {
    const enabled = s.val() === true;
    $('boot').classList.add('hide');
    ready = enabled;
    $('closedView').hidden = enabled;
    if (!enabled) { $('orderView').hidden = true; $('waitView').hidden = true; }
    else if ($('waitView').hidden) $('orderView').hidden = false;
  }, () => {
    $('boot').classList.add('hide');
    $('closedView').hidden = false;
  });

  // 画面を閉じてしまった／再読み込みした場合も、番号の待機に戻す
  const prev = loadTicket();
  if (prev) watchTicket(prev);

  onValue(ref(db, 'menu'), (s) => {
    const data = s.val() || {};
    // 旧バージョンが保存した数値IDが混ざっていても壊れないよう文字列に統一する
    menu = Object.entries(data)
      .map(([key, v]) => ({ ...v, id: String(v?.id ?? key) }))
      .filter(m => m.active !== false)
      .sort((a, b) => (a.sort ?? 0) - (b.sort ?? 0));
    renderMenu(); renderCart();
  });
});

// 匿名ログインを開始（Firebaseで「匿名」が無効なら受付停止画面を出す）
signInAnonymously(auth).catch(() => {
  $('boot').classList.add('hide');
  $('closedView').hidden = false;
});

/* ── メニュー ── */
function renderMenu() {
  $('menuGrid').innerHTML = menu.length ? menu.map(m => `
    <button class="menu-btn" data-add="${esc(m.id)}">
      <span class="m-emoji">${esc(m.emoji || '🍽')}</span>
      <span class="m-name">${esc(m.name)}</span>
      <span class="m-price">${yen(m.price)}</span>
      <span class="m-badge" data-badge="${esc(m.id)}"></span>
    </button>`).join('')
    : '<div class="empty" style="grid-column:1/-1">ただいま準備中です</div>';
  syncBadges();
}

$('menuGrid').addEventListener('click', (e) => {
  const b = e.target.closest('[data-add]');
  if (!b) return;
  const id = b.dataset.add;
  cart[id] = (cart[id] || 0) + 1;
  syncBadges(); renderCart();
  if (navigator.vibrate) navigator.vibrate(12);
});

function syncBadges() {
  document.querySelectorAll('[data-badge]').forEach(el => {
    const q = cart[el.dataset.badge] || 0;
    el.textContent = q; el.classList.toggle('show', q > 0);
  });
}

// ※ 関数宣言にすること（リスナーから初期化前に呼ばれても壊れないため）
function lines() {
  return Object.entries(cart)
    .filter(([, q]) => q > 0)
    .map(([id, qty]) => { const m = menu.find(x => String(x.id) === String(id)); return m ? { ...m, qty } : null; })
    .filter(Boolean);
}

function renderCart() {
  const l = lines();
  const total = l.reduce((s, i) => s + i.price * i.qty, 0);
  $('cartList').innerHTML = l.length ? l.map(i => `
    <div class="cart-row">
      <div class="c-main">
        <div class="c-name">${esc(i.emoji || '')} ${esc(i.name)}</div>
        <div class="c-calc">${yen(i.price)} × ${i.qty} = ${yen(i.price * i.qty)}</div>
      </div>
      <div class="stepper">
        <button class="step-btn" data-q="${esc(i.id)}" data-d="-1">−</button>
        <span class="step-qty">${i.qty}</span>
        <button class="step-btn plus" data-q="${esc(i.id)}" data-d="1">＋</button>
      </div>
    </div>`).join('') : '<div class="empty">メニューをタップして追加してください</div>';
  $('cartTotal').textContent = yen(total);
  $('btnSend').disabled = l.length === 0;
}

$('cartList').addEventListener('click', (e) => {
  const b = e.target.closest('[data-q]');
  if (!b) return;
  const id = b.dataset.q;
  cart[id] = Math.max(0, (cart[id] || 0) + Number(b.dataset.d));
  if (!cart[id]) delete cart[id];
  syncBadges(); renderCart();
});

/* ── 送信 ── */
$('btnSend').addEventListener('click', async () => {
  const l = lines();
  if (!l.length || !ready) return;
  $('btnSend').disabled = true;
  $('btnSend').textContent = '送信中…';

  const total = l.reduce((s, i) => s + i.price * i.qty, 0);
  const cid = newCid();
  const payload = {
    cid,
    items: l.map(i => ({ id: String(i.id), name: i.name, emoji: i.emoji || '', price: i.price, qty: i.qty })),
    total, time: hhmm(), date: todayKey(), timestamp: Date.now(),
  };
  const note = $('fNote').value.trim();
  if (note) payload.note = note;

  try {
    await set(push(ref(db, 'pending')), payload);
    const ticket = {
      cid, total, date: todayKey(),
      items: l.map(i => ({ name: i.name, emoji: i.emoji || '', qty: i.qty })),
    };
    saveTicket(ticket);
    cart = {}; $('fNote').value = '';
    watchTicket(ticket);
  } catch (err) {
    toast('送信できませんでした。電波の良い場所でもう一度お試しください', true);
  } finally {
    $('btnSend').disabled = false;
    $('btnSend').textContent = '注文を送る';
    renderCart();
  }
});

/* ── お呼び出し番号の待機 ── */
function watchTicket(ticket) {
  if (unwatch) { unwatch(); unwatch = null; }
  watching = ticket.cid;
  lastStatus = null;

  $('orderView').hidden = true;
  $('waitView').hidden = false;
  window.scrollTo(0, 0);

  $('waitItems').innerHTML = (ticket.items || [])
    .map(i => `${esc(i.emoji || '')} ${esc(i.name)} <b>×${i.qty}</b>`).join('　')
    + `<div style="margin-top:6px;font-weight:800;color:var(--ink)">${yen(ticket.total)}</div>`;

  paint(null);
  requestWakeLock();

  // 3分たっても確定されない場合の案内
  clearTimeout(watchTicket._t);
  watchTicket._t = setTimeout(() => {
    if (lastStatus === null && watching === ticket.cid) {
      $('waitHint').hidden = false;
      $('waitHint').innerHTML = '混み合っている場合があります。<br>お急ぎのときはスタッフにお声がけください。';
    }
  }, 180000);

  unwatch = onValue(ref(db, 'tickets/' + ticket.cid), (s) => {
    const t = s.val();
    if (!t) return;                       // まだスタッフが確認していない
    if (t.no != null) {
      $('waitNo').textContent = t.no;
      if ($('waitNoWrap').hidden) {
        $('waitNoWrap').hidden = false;
        $('waitNo').classList.add('pulse');
      }
    }
    paint(t.status || 'cooking');
  }, () => {});
}

function paint(status) {
  if (status === lastStatus) return;
  const changed = lastStatus !== null;
  lastStatus = status;

  const box = $('waitBox'), chip = $('waitChip'), chipText = $('waitChipText');
  const sp = chip.querySelector('.sp');
  box.classList.toggle('is-ready', status === 'done');
  chip.className = 'wait-chip';
  $('waitHint').hidden = true;

  if (status === null) {
    chip.classList.add('cooking'); sp.hidden = false;
    chipText.textContent = '確認中';
    $('waitHead').textContent = 'ご注文を送信しました';
    $('waitSub').innerHTML = 'スタッフが確認しております。<br>そのままお待ちください。';
  } else if (status === 'cooking') {
    chip.classList.add('cooking'); sp.hidden = false;
    chipText.textContent = 'ただいま調理中';
    $('waitHead').textContent = 'ご注文をお受けしました';
    $('waitSub').innerHTML = 'お呼びしますので、この番号のまま<br>少々お待ちください。';
  } else if (status === 'done') {
    chip.classList.add('ready'); sp.hidden = true;
    chipText.textContent = 'できあがりました';
    $('waitHead').textContent = 'お受け取りください';
    $('waitSub').innerHTML = 'カウンターまでお越しください。';
    if (changed) {
      if (navigator.vibrate) navigator.vibrate([200, 90, 200, 90, 300]);
      window.scrollTo(0, 0);
    }
  } else if (status === 'rejected') {
    chip.classList.add('stop'); sp.hidden = true;
    chipText.textContent = '受付できません';
    $('waitHead').textContent = '申し訳ございません';
    $('waitSub').innerHTML = 'ご注文をお受けできませんでした。<br>スタッフにお声がけください。';
    releaseWakeLock();
  } else if (status === 'cancelled') {
    chip.classList.add('stop'); sp.hidden = true;
    chipText.textContent = '取消済み';
    $('waitHead').textContent = 'ご注文は取り消されました';
    $('waitSub').innerHTML = 'ご不明な点はスタッフまでお願いいたします。';
    releaseWakeLock();
  }
}

/* 待機中は画面が消えないようにする（対応端末のみ） */
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
  } catch {}
}
function releaseWakeLock() { try { wakeLock?.release(); } catch {} wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && watching && lastStatus !== 'done') requestWakeLock();
});

$('btnAgain').addEventListener('click', () => {
  if (unwatch) { unwatch(); unwatch = null; }
  watching = null; lastStatus = null;
  clearTicket(); releaseWakeLock();
  clearTimeout(watchTicket._t);
  $('waitNoWrap').hidden = true;
  $('waitNo').classList.remove('pulse');
  $('waitView').hidden = true;
  $('orderView').hidden = false;
  syncBadges(); renderCart();
  window.scrollTo(0, 0);
});

let tt;
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg; t.classList.toggle('err', isErr); t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 3000);
}

setTimeout(() => $('boot').classList.add('hide'), 6000);
</script>
</body>
</html>
