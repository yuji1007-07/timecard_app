{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}
{% block content %}
<section class="card login-card">
  <h2>ログイン</h2>
  <form method="post" class="grid-form">
    <label>ユーザーID
      <input type="text" name="username" required>
    </label>
    <label>パスワード
      <input type="password" name="password" required>
    </label>
    <button type="submit">ログイン</button>
  </form>
</section>
{% endblock %}
