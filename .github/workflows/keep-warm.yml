# ============================================================
# サーバーを「起こし続ける」ための設定（コールドスタート対策）
#
# Renderの省エネ仕様で、しばらくアクセスが無いとサーバーが眠り、
# 次に開いたとき起動に時間がかかります。
# これを防ぐため、営業時間帯だけ定期的にトップページへアクセス（合図）して
# サーバーを起こし続けます。
#
# ・追加費用なし／スタッフの操作も不要
# ・夜間〜早朝は動かさないので、無料枠を無駄遣いしません
# ============================================================

name: Keep server warm

on:
  schedule:
    # 時刻はUTC。日本時間(JST)は +9時間。
    # 下記でだいたい「日本時間 7:00〜23:00 のあいだ 12分ごと」になります。
    - cron: "*/12 22-23 * * *"   # UTC 22-23時 = JST 7-8時台
    - cron: "*/12 0-13 * * *"    # UTC 0-13時  = JST 9-22時台
  workflow_dispatch:              # 手動でも実行できる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: サーバーへ合図を送って起こす
        run: |
          echo "ping: $(date)"
          curl -s -o /dev/null -w "status=%{http_code}\n" \
            --max-time 90 \
            https://timecard-app-1.onrender.com/ || true
