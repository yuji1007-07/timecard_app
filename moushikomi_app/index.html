<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- iPadで見やすくするための設定。拡大縮小を許可しつつ初期幅を端末に合わせる -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会員入会申込書アプリ</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 画面上部の共通ヘッダー -->
  <header class="app-header no-print">
    <div class="app-header__inner">
      <a href="#/" class="app-header__logo">📋 申込書アプリ</a>
      <nav class="app-header__nav">
        <a href="#/" class="nav-link">ホーム</a>
        <a href="#/history" class="nav-link">申込履歴</a>
        <a href="#/customers" class="nav-link">顧客管理</a>
        <a href="#/templates" class="nav-link">テンプレート管理</a>
      </nav>
    </div>
  </header>

  <!-- 各画面はこの中に描画されます（app.js が中身を入れ替えます） -->
  <main id="app" class="app-main"></main>

  <!-- PDFバックアップ(ZIP保存)用ライブラリ。CDNから読み込みます -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- ESモジュールとして読み込み。type="module" でファイル分割が使えます -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
