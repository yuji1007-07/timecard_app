# ============================================================
# Netlify 公開設定（ラ・コンシェル整骨院サイト用）
#
# このファイルがあると、Netlify にリポジトリをつないだとき
# 自動で「lacshell_site フォルダだけ」を公開してくれます。
#
# ・公開されるのは lacshell_site/ の中身だけ
#   （勤怠アプリ app.py や申込書アプリなど他のファイルは配信されません）
# ・ビルド作業は不要な静的サイトです
# ・GitHub Pages 版とは別に、並行して公開できます（干渉しません）
# ============================================================

[build]
  publish = "lacshell_site"

# 静的サイトのため変換は不要（拡張子なしURLでも素直に配信）
[build.processing]
  skip_processing = true
